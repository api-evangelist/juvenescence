aid: juvenescence
name: Juvenescence
description: >-
  Juvenescence Limited is a clinical-stage, AI-enabled drug development company headquartered in
  Ramsey, Isle of Man, with operations in the United Kingdom, the United States and Abu Dhabi, founded
  by Jim Mellon, Dr Gregory Bailey and Dr Declan Doogan and led by CEO Dr Richard Marshall CBE. It
  develops medicines that target core mechanisms of aging in order to prevent rather than only treat
  age-related disease, working across small molecules, biologics and cell therapies. Its lead programme
  is the PAI-1 inhibitor MDI-2517, which completed a Phase 1 trial with a Phase 2 proof-of-concept study
  planned in metabolic and fibrotic disease, alongside a CD38 inhibitor programme run with the Buck
  Institute for Research on Aging. The company closed a $76m first tranche of Series B-1 financing led
  by Abu Dhabi's M42 in 2025 and acquired the AI drug-discovery company Ro5 Inc. in June 2025, bringing
  in the HydraScreen structure-based screening and ADMET modelling stack. Juvenescence has founded or
  capitalised a portfolio of longevity biotechs including LyGenesis, Napa Therapeutics, Souvien
  Therapeutics, Morphoceuticals, Relation Therapeutics, Chrysea Labs, Selah Therapeutics and BYOMass.
  Juvenescence runs no developer program and publishes no product API. The machine-readable surfaces it
  does expose are the anonymously readable WordPress REST content API behind juvlabs.com, a
  provider-published llms.txt, and the open-source HydraScreen and bio2d research code released under
  the Ro5-ai GitHub organisation.
