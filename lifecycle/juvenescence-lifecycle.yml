summary: >-
  Juvenescence operates no developer program, so there is no published versioning policy, no
  deprecation policy, no SLA and no status page. What CAN be stated is the versioning scheme the
  contract itself carries, and one concrete retirement: the HydraScreen API that arrived with the Ro5
  acquisition is no longer reachable.
versioning:
  scheme: uri-namespace
  current: wp/v2
  docs: https://developer.wordpress.org/rest-api/
  policy_published: false
  detail: >-
    The version is the REST namespace path segment. wp/v2 is the only content namespace registered.
    Juvenescence publishes no statement about how or when it would move off it; the cadence is
    whatever the upstream WordPress project and the site's plugin set dictate, which is not a
    commitment an integrator can rely on.
deprecation:
  policy_url: null
