changelog:
  url: null
  published: false
  detail: >-
    Juvenescence publishes a dated NEWS stream at https://juvlabs.com/news/ — 57 posts across press
    releases, in-the-news pickups, conference reports, publications and videos — but it is corporate
    news, not an API changelog: it carries no version numbers, no breaking-change notices and no
    additions list. Recording it as a ChangeLog would misrepresent it, so no changelog/ artifact and
    no `ChangeLog` pointer are emitted. The news stream is wired as `Blog` instead.
