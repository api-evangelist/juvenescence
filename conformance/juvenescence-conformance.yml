  evidence: >-
    No FHIR resource shape, HL7 message type, DICOM surface, SMART launch sequence or any other
    health-sector standard appears anywhere in the contract. The only machine-readable API
    Juvenescence exposes serves press releases, corporate pages and a media library; it is not a
    clinical, patient or research-data surface, so no domain standard applies. This check is
    reward-only, so nothing is invented to fill the slot.
  note: >-
    Juvenescence's actual domain identifiers do exist in the content — its publications reference DOIs
