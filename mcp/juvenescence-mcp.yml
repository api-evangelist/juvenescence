summary: >-
  Juvenescence ships no MCP server. This file is a CANDIDATE tool surface derived from the read
  operations of the WordPress content API, so an integrator can see what an MCP wrapper would expose.
  No `MCPServer` pointer is emitted in apis.yml, because none is published.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: none
  verified: derived
  note: >-
    Nobody ships a server for this provider. No endpoint URL is invented here — a guessed MCP path
    that happened to answer 200 would read as a verified agent surface, which is exactly the error
    this field exists to prevent.
search_evidence:
- probe: GET https://juvlabs.com/wp-json/ namespace list
  result: >-
    25 namespaces registered; no `mcp` namespace. (Compare all/enveda-biosciences/, a peer biotech
    WordPress site that DOES register /wp-json/mcp/mcp-adapter-default-server.)
  checked: '2026-08-23'
- probe: GET https://juvlabs.com/wp-json/wp-abilities/v1/abilities
  result: >-
    401 rest_forbidden. The WordPress Abilities API namespace IS registered on this install — that is
    the capability registry a WordPress MCP adapter would surface as tools — but it is authentication
    gated, so the ability set could not be enumerated anonymously. This is the closest thing to an
    agent surface Juvenescence has, and it is one plugin away from being one.
  checked: '2026-08-23'
- probe: GET https://juvlabs.com/wp-json/wp-abilities/v1/categories
  result: 401 rest_forbidden
  checked: '2026-08-23'
- probe: registry.npmjs.org lookups for juvenescence / juvlabs / ro5
  result: 404 on all three
  checked: '2026-08-23'
- probe: GitHub organisations juvlabs and Ro5-ai
  result: >-
    juvlabs has 0 public repositories; Ro5-ai has 2, neither an MCP server (a drug-discovery API
    client and a research code release).
  checked: '2026-08-23'
