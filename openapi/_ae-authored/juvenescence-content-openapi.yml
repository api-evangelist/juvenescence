openapi: 3.1.0
info:
  title: Juvenescence Content API (WordPress REST API)
  version: wp/v2
  description: Anonymously readable content API for juvlabs.com, the corporate site of Juvenescence Limited, derived
    from the WordPress REST route index the site publishes at https://juvlabs.com/wp-json/. It exposes Juvenescence's
    news stream (57 posts across Press Releases, In the News, Juv on the Road, Publications and Videos), the 35
    corporate, science, pipeline and leadership-biography pages, a 466-item media library, the category and tag
    taxonomies, cross-content search, and the site's registered `portfolio` custom post type (registered and publicly
    queryable, but empty at the time of derivation). Juvenescence runs no developer program and publishes no hand-authored
    specification; this document is a faithful derivation of the routes, parameters, defaults and enums the site
    itself advertises, restricted to the read operations verified to return HTTP 200 without credentials on 2026-08-23.
    Write operations are registered on the same routes but are authenticated administrative endpoints, not a public
    API offering, and are deliberately not modelled here. The routes that require credentials on this install (`/wp/v2/users`,
    `/wp/v2/settings`, `/wp/v2/plugins`, `/wp/v2/themes`, `/wp/v2/block-types`, `/wp/v2/menu-locations` and the
    whole `wp-abilities/v1` namespace) are likewise excluded, and are recorded in the repository's authentication
    and conformance artifacts instead.
  contact:
    name: Juvenescence Limited
    url: https://juvlabs.com/contact-us/
  termsOfService: https://juvlabs.com/terms-of-service/
  x-derived-from: https://juvlabs.com/wp-json/
  x-derived-on: '2026-08-23'
  x-api-evangelist-note: Derived by the API Evangelist enrichment pipeline from the provider-published WordPress
    REST route index at https://juvlabs.com/wp-json/ and https://juvlabs.com/wp-json/wp/v2; not authored or endorsed
    by Juvenescence Limited. Every operation was verified to return HTTP 200 without credentials on 2026-08-23.
servers:
- url: https://juvlabs.com/wp-json
  description: Production
security:
- {}
tags:
- name: Posts
  description: Juvenescence press releases, in-the-news items, conference reports, publications and videos
- name: Pages
  description: Corporate, science, pipeline and leadership-biography pages
- name: Media
  description: Media library items (logos, leadership portraits, poster and press imagery)
- name: Categories
  description: Post categories (Press Releases, In the News, Juv on the Road, Publications, Videos)
- name: Tags
  description: Post tags, dominated by Juvenescence portfolio-company names
- name: Comments
  description: Comments on posts (the collection is empty on this site)
- name: Search
  description: Cross-content search over posts, pages and taxonomy terms
- name: Portfolio
  description: The site's registered `portfolio` custom post type and its `portfolio_category` taxonomy
- name: Discovery
  description: Site index, namespace route index, content types, taxonomies, statuses and oEmbed
paths:
  /wp/v2/posts:
    get:
      operationId: listPosts
      tags:
      - Posts
      summary: List news posts
      description: Lists Juvenescence's news stream. 57 posts were published at derivation, distributed across the
        categories In the News (17), Juv on the Road (17), Press Releases (13), Publications (5) and Videos (5).
        Returns `X-WP-Total`, `X-WP-TotalPages` and an RFC 8288 `Link` header. Only `status=publish` is readable
        without credentials.
      security:
      - {}
      responses:
        '200':
          description: A page of news posts.
          headers:
            X-WP-Total:
              description: Total number of items in the unpaginated collection.
              schema:
                type: integer
            X-WP-TotalPages:
              description: Total number of pages available at the current `per_page`.
              schema:
                type: integer
            Link:
              description: RFC 8288 pagination links carrying `rel="next"` and `rel="prev"`.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '404': &id003
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/context'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/before'
      - $ref: '#/components/parameters/modified_after'
      - $ref: '#/components/parameters/modified_before'
      - $ref: '#/components/parameters/author'
      - $ref: '#/components/parameters/author_exclude'
      - $ref: '#/components/parameters/exclude'
      - $ref: '#/components/parameters/include'
      - $ref: '#/components/parameters/search_semantics'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/order'
      - $ref: '#/components/parameters/postOrderby'
      - $ref: '#/components/parameters/search_columns'
      - $ref: '#/components/parameters/slugFilter'
      - $ref: '#/components/parameters/statusFilter'
      - $ref: '#/components/parameters/tax_relation'
      - name: categories
        in: query
        description: Limit result set to items with specific terms assigned in the categories taxonomy. Populated
          category IDs on this site are 5 (Press Releases), 6 (In the News), 50 (Juv on the Road), 52 (Publications)
          and 53 (Videos).
        schema:
          type: array
          items:
            type: integer
      - name: categories_exclude
        in: query
        description: Limit result set to items except those with specific terms assigned in the categories taxonomy.
        schema:
          type: array
          items:
            type: integer
      - name: tags
        in: query
        description: Limit result set to items with specific terms assigned in the tags taxonomy. The populated
          tags on this site name Juvenescence portfolio companies and collaborators — 21 (Juvenescence), 25 (MDI
          Therapeutics), 28 (Napa Therapeutics), 35 (Souvien Therapeutics), 36 (The Buck Institute).
        schema:
          type: array
          items:
            type: integer
      - name: tags_exclude
        in: query
        description: Limit result set to items except those with specific terms assigned in the tags taxonomy.
        schema:
          type: array
          items:
            type: integer
      - name: sticky
        in: query
        description: Limit result set to items that are sticky.
        schema:
          type: boolean
      - name: ignore_sticky
        in: query
        description: Whether to ignore sticky posts or not.
        schema:
          type: boolean
          default: true
      - name: format
        in: query
        description: Limit result set to items assigned one or more given formats.
        schema:
          type: array
          items:
            type: string
  /wp/v2/posts/{id}:
    get:
      operationId: getPost
      tags:
      - Posts
      summary: Get a news post
      description: Retrieves a single news post by ID, including its rendered `title`, `content` and `excerpt`,
        its category and tag assignments, and its `_links` relations.
      security:
      - {}
      responses:
        '200':
          description: The requested news post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401': &id004
          $ref: '#/components/responses/Unauthorized'
        '404': &id005
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/context'
      - $ref: '#/components/parameters/password'
  /wp/v2/pages:
    get:
      operationId: listPages
      tags:
      - Pages
      summary: List pages
      description: 'Lists the site''s 35 published pages: the corporate and science set (`our-approach`, `science`,
        `our-pipeline`, `our-team`, `contact-us`, `solutions`, `news`), the leadership biographies (Jim Mellon,
        Dr Gregory Bailey, Dr Declan Doogan, Dr Richard Marshall CBE, Eileen Jennings-Brown, Professor Eric Verdin,
        Professor Lynne Cox, Professor Hugh Montgomery and others), and the policy pages (`terms-of-service`, `privacy-notice`,
        `cookie-notice`, `refund-policy`, `unsolicited-idea-submission-policy`).'
      security:
      - {}
      responses:
        '200':
          description: A page of pages.
          headers:
            X-WP-Total:
              description: Total number of items in the unpaginated collection.
              schema:
                type: integer
            X-WP-TotalPages:
              description: Total number of pages available at the current `per_page`.
              schema:
                type: integer
            Link:
              description: RFC 8288 pagination links carrying `rel="next"` and `rel="prev"`.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Page'
        '400': *id001
        '401': *id002
        '404': *id003
      parameters:
      - $ref: '#/components/parameters/context'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/before'
      - $ref: '#/components/parameters/modified_after'
      - $ref: '#/components/parameters/modified_before'
      - $ref: '#/components/parameters/author'
      - $ref: '#/components/parameters/author_exclude'
      - $ref: '#/components/parameters/exclude'
      - $ref: '#/components/parameters/include'
      - $ref: '#/components/parameters/menu_order'
      - $ref: '#/components/parameters/search_semantics'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/order'
      - $ref: '#/components/parameters/pageOrderby'
      - $ref: '#/components/parameters/parentFilter'
      - $ref: '#/components/parameters/parent_exclude'
      - $ref: '#/components/parameters/search_columns'
      - $ref: '#/components/parameters/slugFilter'
      - $ref: '#/components/parameters/statusFilter'
  /wp/v2/pages/{id}:
    get:
      operationId: getPage
      tags:
      - Pages
      summary: Get a page
      description: 'Retrieves a single page by ID, including its rendered content. Useful IDs at derivation: 3809
        (Our Pipeline), 4139 (Our Team), 4524 (Science), 5786 (Our Approach), 4275 (Contact Us), 920 (Terms Of Service),
        879 (Privacy Notice).'
      security:
      - {}
      responses:
        '200':
          description: The requested page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '401': *id004
        '404': *id005
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/context'
      - $ref: '#/components/parameters/password'
  /wp/v2/media:
    get:
      operationId: listMedia
      tags:
      - Media
      summary: List media items
      description: Lists the 466-item media library — the Juvenescence logo and sub-mark, leadership portraits,
        press and conference imagery, and documents. `media_details` carries the generated size variants for each
        image.
      security:
      - {}
      responses:
        '200':
          description: A page of media items.
          headers:
            X-WP-Total:
              description: Total number of items in the unpaginated collection.
              schema:
                type: integer
            X-WP-TotalPages:
              description: Total number of pages available at the current `per_page`.
              schema:
                type: integer
            Link:
              description: RFC 8288 pagination links carrying `rel="next"` and `rel="prev"`.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaItem'
        '400': *id001
        '401': *id002
        '404': *id003
      parameters:
      - $ref: '#/components/parameters/context'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/before'
      - $ref: '#/components/parameters/modified_after'
      - $ref: '#/components/parameters/modified_before'
      - $ref: '#/components/parameters/author'
      - $ref: '#/components/parameters/author_exclude'
      - $ref: '#/components/parameters/exclude'
      - $ref: '#/components/parameters/include'
      - $ref: '#/components/parameters/search_semantics'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/order'
      - $ref: '#/components/parameters/postOrderby'
      - $ref: '#/components/parameters/parentFilter'
      - $ref: '#/components/parameters/parent_exclude'
      - $ref: '#/components/parameters/search_columns'
      - $ref: '#/components/parameters/slugFilter'
      - name: status
        in: query
        description: Limit result set to attachments assigned one or more statuses.
        schema:
          type: array
          items:
            type: string
          default:
          - inherit
      - name: media_type
        in: query
        description: Limit result set to attachments of a particular media type or media types.
        schema:
          type: array
          items:
            type: string
            enum:
            - image
            - video
            - text
            - application
            - audio
            - file
      - name: mime_type
        in: query
        description: Limit result set to attachments of a particular MIME type or MIME types.
        schema:
          type: array
          items:
            type: string
  /wp/v2/media/{id}:
    get:
      operationId: getMediaItem
      tags:
      - Media
      summary: Get a media item
      description: Retrieves a single media library item by ID, including `source_url` and the generated size variants
        in `media_details`.
      security:
      - {}
      responses:
        '200':
          description: The requested media item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'
        '401': *id004
        '404': *id005
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/context'
  /wp/v2/categories:
    get:
      operationId: listCategories
      tags:
      - Categories
      summary: List post categories
      description: 'Lists the 7 registered post categories. Five are populated: Press Releases (5, 13 posts), In
        the News (6, 17), Juv on the Road (50, 17), Publications (52, 5) and Videos (53, 5). `Healthy Aging & Lifestyle`
        (10) and `Uncategorized` (1) are registered but empty.'
      security:
      - {}
      responses:
        '200':
          description: A page of categories.
          headers:
            X-WP-Total:
              description: Total number of items in the unpaginated collection.
              schema:
                type: integer
            X-WP-TotalPages:
              description: Total number of pages available at the current `per_page`.
              schema:
                type: integer
            Link:
              description: RFC 8288 pagination links carrying `rel="next"` and `rel="prev"`.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Term'
        '400': *id001
        '401': *id002
        '404': *id003
      parameters:
      - &id006
        $ref: '#/components/parameters/context'
      - &id007
        $ref: '#/components/parameters/page'
      - &id008
        $ref: '#/components/parameters/per_page'
      - &id009
        $ref: '#/components/parameters/search'
      - &id010
        $ref: '#/components/parameters/exclude'
      - &id011
        $ref: '#/components/parameters/include'
      - &id012
        $ref: '#/components/parameters/orderAsc'
      - &id013
        $ref: '#/components/parameters/termOrderby'
      - &id014
        $ref: '#/components/parameters/hide_empty'
      - &id015
        $ref: '#/components/parameters/termPost'
      - &id016
        $ref: '#/components/parameters/slugFilter'
      - $ref: '#/components/parameters/termParent'
  /wp/v2/categories/{id}:
    get:
      operationId: getCategory
      tags:
      - Categories
      summary: Get a post category
      description: Retrieves a single post category by ID, including its post `count` and archive `link`.
      security:
      - {}
      responses:
        '200':
          description: The requested category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Term'
        '401': *id004
        '404': *id005
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/context'
  /wp/v2/tags:
    get:
      operationId: listTags
      tags:
      - Tags
      summary: List post tags
      description: Lists the 25 registered post tags. The vocabulary is dominated by Juvenescence portfolio companies
        and collaborators — AgeX, Chrysea Labs, Evgen Pharma, LyGenesis, MDI Therapeutics, Morphoceuticals, Napa
        Therapeutics, NetraMark Corp., Relation Therapeutics, Selah Therapeutics, Souvien Therapeutics and The Buck
        Institute — alongside a legacy consumer-nutrition set (Keto, Ketosis 101, Ketone Science, Intermittent Fasting,
        Meal Replacement, Protein, Vegan, Recipe) from the company's earlier supplements business. Only 5 tags carry
        posts.
      security:
      - {}
      responses:
        '200':
          description: A page of tags.
          headers:
            X-WP-Total:
              description: Total number of items in the unpaginated collection.
              schema:
                type: integer
            X-WP-TotalPages:
              description: Total number of pages available at the current `per_page`.
              schema:
                type: integer
            Link:
              description: RFC 8288 pagination links carrying `rel="next"` and `rel="prev"`.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Term'
        '400': *id001
        '401': *id002
        '404': *id003
      parameters:
      - *id006
      - *id007
      - *id008
      - *id009
      - *id010
      - *id011
      - *id012
      - *id013
      - *id014
      - *id015
      - *id016
      - $ref: '#/components/parameters/offset'
  /wp/v2/tags/{id}:
    get:
      operationId: getTag
      tags:
      - Tags
      summary: Get a post tag
      description: Retrieves a single post tag by ID, including its post `count` and archive `link`.
      security:
      - {}
      responses:
        '200':
          description: The requested tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Term'
        '401': *id004
        '404': *id005
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/context'
  /wp/v2/comments:
    get:
      operationId: listComments
      tags:
      - Comments
      summary: List comments
      description: 'Lists approved comments. The collection is empty on juvlabs.com (`X-WP-Total: 0`) — comments
        are not used on this site. The `author`, `author_email`, `status` and `type` filters require credentials
        and are omitted here.'
      security:
      - {}
      responses:
        '200':
          description: A page of comments. Empty on this site.
          headers:
            X-WP-Total:
              description: Total number of items in the unpaginated collection.
              schema:
                type: integer
            X-WP-TotalPages:
              description: Total number of pages available at the current `per_page`.
              schema:
                type: integer
            Link:
              description: RFC 8288 pagination links carrying `rel="next"` and `rel="prev"`.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '400': *id001
        '401': *id002
        '404': *id003
      parameters:
      - $ref: '#/components/parameters/context'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/before'
      - $ref: '#/components/parameters/exclude'
      - $ref: '#/components/parameters/include'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/order'
      - $ref: '#/components/parameters/parentFilter'
      - $ref: '#/components/parameters/parent_exclude'
      - $ref: '#/components/parameters/password'
      - name: orderby
        in: query
        description: Sort collection by comment attribute.
        schema:
          type: string
          default: date_gmt
          enum:
          - date
          - date_gmt
          - id
          - include
          - post
          - parent
          - type
      - name: post
        in: query
        description: Limit result set to comments assigned to specific post IDs.
        schema:
          type: array
          items:
            type: integer
  /wp/v2/comments/{id}:
    get:
      operationId: getComment
      tags:
      - Comments
      summary: Get a comment
      description: Retrieves a single comment by ID. No comments exist on juvlabs.com, so this operation returns
        404 for every ID at derivation.
      security:
      - {}
      responses:
        '200':
          description: The requested comment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '401': *id004
        '404': *id005
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/context'
      - $ref: '#/components/parameters/password'
  /wp/v2/search:
    get:
      operationId: searchContent
      tags:
      - Search
      summary: Search across content
      description: Cross-content search over posts, pages, the portfolio type and taxonomy terms. A search for `aging`
        returned 46 hits at derivation. Set `type=term` to search taxonomy terms instead of posts, and `subtype`
        to narrow to one post type or taxonomy. This is the single best entry point for an agent that needs to find
        Juvenescence material without walking every collection.
      security:
      - {}
      responses:
        '200':
          description: A page of search results.
          headers:
            X-WP-Total:
              description: Total number of items in the unpaginated collection.
              schema:
                type: integer
            X-WP-TotalPages:
              description: Total number of pages available at the current `per_page`.
              schema:
                type: integer
            Link:
              description: RFC 8288 pagination links carrying `rel="next"` and `rel="prev"`.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchResult'
        '400': *id001
        '401': *id002
        '404': *id003
      parameters:
      - $ref: '#/components/parameters/contextEmbed'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/exclude'
      - $ref: '#/components/parameters/include'
      - name: type
        in: query
        description: Limit results to items of an object type.
        schema:
          type: string
          default: post
          enum:
          - post
          - term
          - post-format
      - name: subtype
        in: query
        description: Limit results to items of one or more object subtypes, e.g. `post`, `page`, `portfolio`, `category`,
          `post_tag`.
        schema:
          type: array
          items:
            type: string
          default:
          - any
  /wp/v2/portfolio:
    get:
      operationId: listPortfolio
      tags:
      - Portfolio
      summary: List portfolio items
      description: 'Lists items of the site''s registered `portfolio` custom post type. The type is registered,
        public, archive-enabled and REST-exposed, but the collection returned `X-WP-Total: 0` at derivation — Juvenescence''s
        portfolio companies are currently described in page copy and post tags rather than in this type.'
      security:
      - {}
      responses:
        '200':
          description: A page of portfolio items. Empty at derivation.
          headers:
            X-WP-Total:
              description: Total number of items in the unpaginated collection.
              schema:
                type: integer
            X-WP-TotalPages:
              description: Total number of pages available at the current `per_page`.
              schema:
                type: integer
            Link:
              description: RFC 8288 pagination links carrying `rel="next"` and `rel="prev"`.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PortfolioItem'
        '400': *id001
        '401': *id002
        '404': *id003
      parameters:
      - $ref: '#/components/parameters/context'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/before'
      - $ref: '#/components/parameters/modified_after'
      - $ref: '#/components/parameters/modified_before'
      - $ref: '#/components/parameters/author'
      - $ref: '#/components/parameters/author_exclude'
      - $ref: '#/components/parameters/exclude'
      - $ref: '#/components/parameters/include'
      - $ref: '#/components/parameters/menu_order'
      - $ref: '#/components/parameters/search_semantics'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/order'
      - $ref: '#/components/parameters/pageOrderby'
      - $ref: '#/components/parameters/search_columns'
      - $ref: '#/components/parameters/slugFilter'
      - $ref: '#/components/parameters/statusFilter'
      - $ref: '#/components/parameters/tax_relation'
      - name: portfolio_category
        in: query
        description: Limit result set to items with specific terms assigned in the portfolio_category taxonomy.
        schema:
          type: array
          items:
            type: integer
      - name: portfolio_category_exclude
