        post:
          type:
          - integer
          - 'null'
          description: The ID for the associated post of the attachment.
        source_url:
          type: string
          format: uri
          description: URL to the original attachment file.
        _links:
          $ref: '#/components/schemas/Links'
    Term:
      type: object
      description: A taxonomy term (category, post tag, or portfolio category).
      properties:
        id:
          type: integer
          description: Unique identifier for the term.
        count:
          type: integer
          description: Number of published posts for the term.
        description:
          type: string
          description: HTML description of the term.
        link:
          type: string
          format: uri
          description: URL of the term archive on juvlabs.com.
        name:
          type: string
          description: HTML title for the term.
          examples:
          - Press Releases
          - In the News
          - Juv on the Road
          - Publications
          - Videos
        slug:
          type: string
          description: An alphanumeric identifier for the term unique to its type.
        taxonomy:
          type: string
          description: Type attribution for the term.
          examples:
          - category
          - post_tag
          - portfolio_category
        parent:
          type: integer
          description: The parent term ID. Hierarchical taxonomies only.
        _links:
          $ref: '#/components/schemas/Links'
    Comment:
      type: object
      description: A comment on a post. The collection is empty on juvlabs.com.
