  /oembed/1.0/embed:
    get:
      operationId: getOembed
      tags:
      - Discovery
      summary: Get an oEmbed response for a juvlabs.com URL
      description: Returns an oEmbed 1.0 rich response for any juvlabs.com URL — the lightest way to resolve a Juvenescence
        page or news URL to its title, author and embed HTML without fetching the page.
      security:
      - {}
      responses:
        '200':
          description: The oEmbed response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OEmbed'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: url
        in: query
        required: true
        description: The URL of the resource for which to fetch oEmbed data. Must be on juvlabs.com.
        schema:
          type: string
          format: uri
      - name: format
        in: query
        description: The oEmbed format to use.
        schema:
          type: string
          default: json
          enum:
          - json
          - xml
      - name: maxwidth
        in: query
        description: The maximum width of the embed frame in pixels.
        schema:
          type: integer
          default: 600
components:
  parameters:
    context:
      name: context
      in: query
      description: Scope under which the request is made; determines fields present in response.
      schema:
        type: string
        default: view
        enum:
        - view
        - embed
        - edit
    contextEmbed:
      name: contextEmbed
      in: query
      description: Scope under which the request is made; determines fields present in response.
      schema:
        type: string
        default: view
        enum:
        - view
        - embed
    page:
      name: page
      in: query
      description: Current page of the collection.
      schema:
        type: integer
        default: 1
        minimum: 1
    per_page:
      name: per_page
      in: query
      description: Maximum number of items to be returned in result set.
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100
    search:
      name: search
      in: query
      description: Limit results to those matching a string.
      schema:
        type: string
    after:
      name: after
      in: query
      description: Limit response to posts published after a given ISO8601 compliant date.
      schema:
        type: string
        format: date-time
    before:
      name: before
      in: query
      description: Limit response to posts published before a given ISO8601 compliant date.
      schema:
        type: string
        format: date-time
    modified_after:
      name: modified_after
      in: query
      description: Limit response to posts modified after a given ISO8601 compliant date.
      schema:
        type: string
        format: date-time
    modified_before:
      name: modified_before
      in: query
      description: Limit response to posts modified before a given ISO8601 compliant date.
      schema:
        type: string
        format: date-time
    author:
      name: author
      in: query
      description: Limit result set to posts assigned to specific authors.
      schema:
        type: array
        items:
          type: integer
    author_exclude:
      name: author_exclude
      in: query
      description: Ensure result set excludes posts assigned to specific authors.
      schema:
        type: array
        items:
          type: integer
    exclude:
      name: exclude
      in: query
      description: Ensure result set excludes specific IDs.
      schema:
        type: array
        items:
          type: integer
    include:
      name: include
      in: query
      description: Limit result set to specific IDs.
      schema:
        type: array
        items:
          type: integer
    offset:
      name: offset
      in: query
      description: Offset the result set by a specific number of items.
      schema:
        type: integer
    order:
      name: order
      in: query
      description: Order sort attribute ascending or descending.
      schema:
        type: string
        default: desc
        enum:
        - asc
        - desc
    orderAsc:
      name: orderAsc
      in: query
      description: Order sort attribute ascending or descending.
      schema:
        type: string
        default: asc
        enum:
        - asc
        - desc
    search_semantics:
      name: search_semantics
      in: query
      description: How to interpret the search input.
      schema:
        type: string
        enum:
        - exact
    search_columns:
      name: search_columns
      in: query
      description: Array of column names to be searched.
      schema:
        type: array
        items:
          type: string
    slugFilter:
      name: slugFilter
      in: query
      description: Limit result set to items with one or more specific slugs.
      schema:
        type: array
        items:
          type: string
    statusFilter:
      name: statusFilter
      in: query
      description: Limit result set to posts assigned one or more statuses. Only `publish` is readable without credentials
        on this install.
      schema:
        type: array
        items:
          type: string
        default:
        - publish
    tax_relation:
      name: tax_relation
      in: query
      description: Limit result set based on relationship between multiple taxonomies.
      schema:
        type: string
        enum:
        - AND
        - OR
    parentFilter:
      name: parentFilter
      in: query
      description: Limit result set to items with particular parent IDs.
      schema:
        type: array
        items:
          type: integer
    parent_exclude:
      name: parent_exclude
      in: query
      description: Limit result set to all items except those of a particular parent ID.
      schema:
        type: array
        items:
          type: integer
    hide_empty:
      name: hide_empty
      in: query
      description: Whether to hide terms not assigned to any posts.
      schema:
        type: boolean
        default: false
    termParent:
      name: termParent
      in: query
      description: Limit result set to terms assigned to a specific parent.
      schema:
        type: integer
    termPost:
      name: termPost
      in: query
      description: Limit result set to terms assigned to a specific post.
      schema:
        type: integer
    termOrderby:
      name: termOrderby
      in: query
      description: Sort collection by term attribute.
      schema:
        type: string
        default: name
        enum:
        - id
        - include
        - name
        - slug
        - include_slugs
        - term_group
        - description
        - count
    postOrderby:
      name: postOrderby
      in: query
      description: Sort collection by post attribute.
      schema:
        type: string
        default: date
        enum:
        - author
        - date
        - id
        - include
        - modified
        - parent
        - relevance
        - slug
        - include_slugs
        - title
    pageOrderby:
      name: pageOrderby
      in: query
      description: Sort collection by post attribute.
      schema:
        type: string
        default: date
        enum:
        - author
        - date
        - id
        - include
        - modified
        - parent
        - relevance
        - slug
        - include_slugs
        - title
        - menu_order
    menu_order:
      name: menu_order
      in: query
      description: Limit result set to posts with a specific menu_order value.
      schema:
        type: integer
    id:
      name: id
      in: path
      description: Unique identifier for the resource.
      schema:
        type: integer
      required: true
    password:
      name: password
      in: query
      description: The password for the post if it is password protected.
      schema:
        type: string
  schemas:
    Rendered:
      type: object
      description: A WordPress rendered-content object.
      properties:
        rendered:
          type: string
          description: HTML for the field, transformed for display.
    Post:
      type: object
      description: A Juvenescence news item — press release, in-the-news pickup, conference report, publication
        abstract or video.
      properties:
        id:
          type: integer
          description: Unique identifier for the post.
        date:
          type: string
          format: date-time
          description: The date the post was published, in the site's timezone.
        date_gmt:
          type: string
          format: date-time
          description: The date the post was published, as GMT.
        guid:
          $ref: '#/components/schemas/Rendered'
        modified:
          type: string
          format: date-time
          description: The date the post was last modified, in the site's timezone.
        modified_gmt:
          type: string
          format: date-time
          description: The date the post was last modified, as GMT.
        slug:
          type: string
          description: An alphanumeric identifier for the post unique to its type.
        status:
          type: string
          description: A named status for the post.
          examples:
          - publish
        type:
          type: string
          description: Type of post.
          examples:
          - post
        link:
          type: string
          format: uri
          description: URL to the post on juvlabs.com.
        title:
          $ref: '#/components/schemas/Rendered'
        content:
          $ref: '#/components/schemas/Rendered'
        excerpt:
          $ref: '#/components/schemas/Rendered'
        author:
          type: integer
          description: The ID for the author of the post.
        featured_media:
          type: integer
          description: The ID of the featured media for the post.
        comment_status:
          type: string
          description: Whether or not comments are open on the post.
        ping_status:
          type: string
          description: Whether or not the post can be pinged.
        sticky:
          type: boolean
          description: Whether or not the post should be treated as sticky.
        format:
          type: string
          description: The format for the post.
        categories:
          type: array
          items:
            type: integer
          description: The terms assigned to the post in the category taxonomy.
        tags:
          type: array
          items:
            type: integer
          description: The terms assigned to the post in the post_tag taxonomy.
        _links:
          $ref: '#/components/schemas/Links'
    Page:
      type: object
      description: A Juvenescence corporate, science, pipeline or leadership-biography page.
      properties:
        id:
          type: integer
          description: Unique identifier for the page.
        date:
          type: string
          format: date-time
          description: The date the page was published, in the site's timezone.
        date_gmt:
          type: string
          format: date-time
          description: The date the page was published, as GMT.
        modified:
          type: string
          format: date-time
          description: The date the page was last modified, in the site's timezone.
        slug:
          type: string
          description: An alphanumeric identifier for the page.
          examples:
          - our-pipeline
          - our-team
          - science
          - our-approach
          - contact-us
        status:
          type: string
          description: A named status for the page.
        type:
          type: string
          description: Type of post.
          examples:
          - page
        link:
          type: string
          format: uri
          description: URL to the page on juvlabs.com.
        title:
          $ref: '#/components/schemas/Rendered'
        content:
          $ref: '#/components/schemas/Rendered'
        excerpt:
          $ref: '#/components/schemas/Rendered'
        author:
          type: integer
          description: The ID for the author of the page.
        featured_media:
          type: integer
          description: The ID of the featured media for the page.
        parent:
          type: integer
          description: The ID for the parent of the page.
        menu_order:
          type: integer
          description: The order of the page in relation to other pages.
        template:
          type: string
          description: The theme file to use to display the page.
        _links:
          $ref: '#/components/schemas/Links'
    MediaItem:
      type: object
      description: A media library item — logo, leadership portrait, press or poster image, or document.
      properties:
        id:
          type: integer
          description: Unique identifier for the attachment.
        date:
          type: string
          format: date-time
          description: The date the attachment was published.
        slug:
          type: string
          description: An alphanumeric identifier for the attachment.
        type:
          type: string
          description: Type of post.
          examples:
          - attachment
        link:
          type: string
          format: uri
          description: URL to the attachment page.
        title:
          $ref: '#/components/schemas/Rendered'
        author:
          type: integer
          description: The ID for the author of the attachment.
        caption:
          $ref: '#/components/schemas/Rendered'
        alt_text:
          type: string
          description: Alternative text to display when attachment is not displayed.
        media_type:
          type: string
          description: Attachment type.
          examples:
          - image
          - file
        mime_type:
          type: string
          description: The attachment MIME type.
          examples:
          - image/png
          - image/jpeg
        media_details:
          type: object
          description: Details about the media file, specific to its type (width, height, filesize, and the generated
            size variants).
