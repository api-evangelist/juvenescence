        id:
          type: integer
          description: Unique identifier for the comment.
        author_name:
          type: string
          description: Display name for the comment author.
        content:
          $ref: '#/components/schemas/Rendered'
        date:
          type: string
          format: date-time
          description: The date the comment was published.
        link:
          type: string
          format: uri
          description: URL to the comment.
        parent:
          type: integer
          description: The ID for the parent of the comment.
        post:
          type: integer
          description: The ID of the associated post object.
        status:
          type: string
          description: State of the comment.
        type:
          type: string
          description: Type of the comment.
        _links:
          $ref: '#/components/schemas/Links'
    SearchResult:
      type: object
      description: A cross-content search hit.
      properties:
        id:
          type: integer
          description: Unique identifier for the object.
        title:
          type: string
          description: The title for the object.
        url:
          type: string
          format: uri
          description: URL to the object.
        type:
          type: string
          description: Object type.
          examples:
          - post
          - term
        subtype:
          type: string
          description: Object subtype.
          examples:
          - post
          - page
          - portfolio
          - category
          - post_tag
        _links:
          $ref: '#/components/schemas/Links'
    PortfolioItem:
      type: object
      description: 'An item of the site''s registered `portfolio` custom post type. The type is registered, public
        and REST-enabled, and the collection returned X-WP-Total: 0 when derived — the shape below is the type''s
        registered field set, not observed content.'
      properties:
        id:
          type: integer
          description: Unique identifier for the portfolio item.
        date:
          type: string
          format: date-time
          description: The date the item was published.
        slug:
          type: string
          description: An alphanumeric identifier for the item.
        status:
          type: string
          description: A named status for the item.
        type:
          type: string
          description: Type of post.
          examples:
          - portfolio
        link:
          type: string
          format: uri
          description: URL to the item on juvlabs.com.
        title:
          $ref: '#/components/schemas/Rendered'
        content:
          $ref: '#/components/schemas/Rendered'
        excerpt:
          $ref: '#/components/schemas/Rendered'
        featured_media:
          type: integer
          description: The ID of the featured media for the item.
        menu_order:
          type: integer
          description: The order of the item in relation to other items.
        portfolio_category:
          type: array
          items:
            type: integer
          description: The terms assigned to the item in the portfolio_category taxonomy.
        _links:
          $ref: '#/components/schemas/Links'
    PostType:
      type: object
      description: A registered post type.
      properties:
        description:
          type: string
          description: A human-readable description of the post type.
        hierarchical:
          type: boolean
          description: Whether or not the post type should have children.
        has_archive:
          type:
          - boolean
          - string
          description: If the value is a string, the value will be used as the archive slug.
        name:
          type: string
          description: The title for the post type.
        slug:
          type: string
          description: An alphanumeric identifier for the post type.
          examples:
          - post
          - page
          - attachment
          - portfolio
        taxonomies:
          type: array
          items:
            type: string
          description: All taxonomies associated with this post type.
        rest_base:
          type: string
          description: REST base route for the post type.
        rest_namespace:
          type: string
          description: REST route's namespace for the post type.
        _links:
          $ref: '#/components/schemas/Links'
    Taxonomy:
      type: object
      description: A registered taxonomy.
      properties:
        name:
          type: string
          description: The title for the taxonomy.
        slug:
          type: string
          description: An alphanumeric identifier for the taxonomy.
          examples:
          - category
          - post_tag
          - portfolio_category
        description:
          type: string
          description: A human-readable description of the taxonomy.
        types:
          type: array
          items:
            type: string
          description: Types associated with the taxonomy.
        hierarchical:
          type: boolean
          description: Whether or not the taxonomy should have children.
        rest_base:
          type: string
          description: REST base route for the taxonomy.
        rest_namespace:
          type: string
          description: REST route's namespace for the taxonomy.
        _links:
          $ref: '#/components/schemas/Links'
    Status:
      type: object
      description: A registered post status.
      properties:
        name:
          type: string
          description: The title for the status.
        public:
          type: boolean
          description: Whether posts with this status should be shown in the front end of the site.
        queryable:
          type: boolean
          description: Whether posts with this status should be publicly-queryable.
        slug:
          type: string
          description: An alphanumeric identifier for the status.
          examples:
          - publish
        date_floating:
          type: boolean
          description: Whether the status is excluded from the date query.
        _links:
          $ref: '#/components/schemas/Links'
    SiteIndex:
      type: object
      description: The WordPress REST API site index — the discovery document served at /wp-json/.
      properties:
        name:
          type: string
          description: The site name.
          examples:
          - Juvenescence
        description:
          type: string
          description: The site tagline.
          examples:
          - Extending Healthy Lifespan
        url:
          type: string
          format: uri
          description: The site URL.
        home:
          type: string
          format: uri
          description: The site home URL.
        gmt_offset:
          type:
          - number
          - string
          description: The site GMT offset.
        namespaces:
          type: array
          items:
            type: string
          description: The registered REST namespaces. 25 are registered on this install.
        authentication:
          type: object
          description: Advertised authentication schemes. Empty on this install — no application-password or OAuth
            discovery is exposed.
          additionalProperties: true
        site_icon_url:
          type: string
          format: uri
          description: URL of the site icon.
        routes:
          type: object
          description: The full route table, keyed by route pattern. 512 routes are registered on this install;
            most belong to administrative plugin namespaces and require credentials.
          additionalProperties: true
        _links:
          $ref: '#/components/schemas/Links'
    NamespaceIndex:
      type: object
      description: The route index for a single REST namespace.
      properties:
        namespace:
          type: string
          description: The namespace identifier.
          examples:
          - wp/v2
        routes:
          type: object
          description: Routes registered in this namespace, keyed by route pattern, each carrying its methods, endpoints
            and per-argument schema.
          additionalProperties: true
        _links:
          $ref: '#/components/schemas/Links'
    OEmbed:
      type: object
      description: An oEmbed 1.0 rich response for a juvlabs.com URL.
      properties:
        version:
          type: string
          examples:
          - '1.0'
          description: The oEmbed version number.
        provider_name:
          type: string
          examples:
          - Juvenescence
          description: The provider name.
        provider_url:
          type: string
          format: uri
          description: The provider URL.
        author_name:
          type: string
          description: The author name.
        title:
          type: string
          description: The resource title.
        type:
          type: string
          description: The resource type.
        width:
          type: integer
          description: The embed width.
        height:
          type: integer
          description: The embed height.
        html:
          type: string
          description: The embed HTML.
    Links:
      type: object
      description: HAL-style `_links` relations WordPress attaches to every resource — `self`, `collection`, `about`,
        `author`, `replies`, `wp:featuredmedia`, `wp:term` and `curies`.
      additionalProperties: true
    Error:
      type: object
      description: The WordPress REST error envelope. This API does NOT use RFC 9457 application/problem+json; errors
        are returned as application/json with this shape.
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
          description: A machine-readable error code.
          examples:
          - rest_post_invalid_id
          - rest_invalid_param
          - rest_no_route
          - rest_forbidden
        message:
          type: string
          description: A human-readable error message.
        data:
          type: object
          description: Error detail. Always carries the HTTP status; validation errors also carry `params` and `details`
            keyed by the offending parameter.
          properties:
            status:
              type: integer
              description: The HTTP status code.
            params:
              type: object
              additionalProperties:
                type: string
              description: Per-parameter validation messages.
            details:
              type: object
              additionalProperties: true
              description: Per-parameter structured validation detail.
          additionalProperties: true
  responses:
    BadRequest:
      description: Invalid parameter. Returned with code `rest_invalid_param` and a per-parameter `data.params`
        map, e.g. `per_page must be between 1 (inclusive) and 100 (inclusive)`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidParam:
              value:
                code: rest_invalid_param
                message: 'Invalid parameter(s): per_page'
                data:
                  status: 400
                  params:
                    per_page: per_page must be between 1 (inclusive) and 100 (inclusive)
    Unauthorized:
      description: The requested context or route requires credentials. Returned with code `rest_forbidden` when
        `context=edit` is requested anonymously.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              value:
                code: rest_forbidden
                message: Sorry, you are not allowed to do that.
                data:
                  status: 401
    NotFound:
      description: No such resource, or no route matching the URL and method.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidId:
              value:
                code: rest_post_invalid_id
                message: Invalid post ID.
                data:
                  status: 404
            noRoute:
              value:
                code: rest_no_route
                message: No route was found matching the URL and request method.
                data:
                  status: 404
