credentialed_only:
- route: /wp/v2/users
  status: 403
  code: aios_user_lists_forbidden
  note: >-
    User enumeration is explicitly blocked by the All In One Security plugin rather than merely
    unauthorised — a deliberate hardening choice worth crediting.
- route: /wp/v2/settings
  status: 401
  code: rest_forbidden
- route: /wp/v2/plugins
  status: 401
  code: rest_cannot_view_plugins
- route: /wp/v2/themes
  status: 401
  code: rest_cannot_view_themes
- route: /wp/v2/block-types
