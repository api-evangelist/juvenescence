method: probed
source: >-
  openapi/_original/juvenescence-content-openapi.yml, https://juvlabs.com/wp-json/ (site index), and
  live anonymous GETs against every wp/v2 route on 2026-08-23
docs: https://developer.wordpress.org/rest-api/using-the-rest-api/authentication/
summary: >-
  The Juvenescence content API requires NO credentials for everything this profile models. The site
  index at https://juvlabs.com/wp-json/ returns "authentication": [] — the install advertises no
  discoverable authentication scheme at all, no application-password endpoint discovery, no OAuth and
  no OIDC. Anonymous callers get published posts, pages, media, taxonomy terms, search, the registered
  content-type metadata and oEmbed. Administrative routes are registered on the same namespace but
  reject anonymous callers with HTTP 401/403, and are not modelled as a public API surface. Because
  there is no scope surface of any kind, no scopes/ artifact is emitted for this provider.
security_schemes: []
public_access:
  anonymous_read: true
  api_key_required: false
  registration_required: false
  cors:
    access_control_allow_headers: Authorization, X-WP-Nonce, Content-Disposition, Content-MD5, Content-Type
    access_control_expose_headers: X-WP-Total, X-WP-TotalPages, Link
    note: >-
      The install advertises Authorization and X-WP-Nonce as acceptable request headers — the standard
      WordPress cookie+nonce and application-password paths — but neither is obtainable by a third
      party, since juvlabs.com publishes no signup, no developer portal and no credential issuance.
