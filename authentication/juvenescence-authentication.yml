- route: /wp-abilities/v1/abilities
  status: 401
  code: rest_forbidden
  note: >-
    The WordPress Abilities API namespace IS registered on this install — the agent-facing capability
    registry that the WordPress MCP adapter exposes as tools — but an anonymous GET is refused, so the
    published ability set could not be enumerated. Recorded, not guessed. See mcp/juvenescence-mcp.yml.
- route: /wp-abilities/v1/categories
  status: 401
  code: rest_forbidden
write_operations:
  modelled: false
  note: >-
    POST/PUT/PATCH/DELETE are registered on the content routes but are authenticated administrative
    endpoints for site editors, not a public API offering. They are deliberately excluded from the
    OpenAPI in this repository.
